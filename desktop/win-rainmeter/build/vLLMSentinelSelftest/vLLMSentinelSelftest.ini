; ============================================================
;  vLLM Sentinel 自检皮肤（诊断用，不是正式组件）
;
;  用途：出问题时先加载这个，一眼分清是"坐标渲染"还是"数据链路"的毛病。
;  判读：
;    · 三行文字若自上而下分开、互不重叠 → Rainmeter 坐标渲染正常
;    · 第 4 行显示"标题 / 状态 / 颜色"三串字 → 数据链路（EasyTier + /api/skin）正常
;    · 第 5 行有彩条 → Bar 度量取数正常
;  需要改地址时只改下面 SERVER 一行。
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
DragEnabled=1
RestoreAfterRestart=1

[Variables]
SERVER=http://your-server-ip:8889

[BG]
Meter=Image
X=0
Y=0
W=560
H=286
SolidColor=13,19,33,255

[T0]
Meter=String
X=16
Y=12
FontFace=Microsoft YaHei UI
FontSize=10
FontWeight=Bold
FontColor=226,232,240,255
AntiAlias=1
Text=自检：三行文字应自上而下分开显示

[T1]
Meter=String
X=16
Y=44
FontFace=Microsoft YaHei UI
FontSize=10
FontColor=126,226,168,255
AntiAlias=1
Text=第 1 行（Y=44）

[T2]
Meter=String
X=16
Y=78
FontFace=Microsoft YaHei UI
FontSize=10
FontColor=110,140,255,255
AntiAlias=1
Text=第 2 行（Y=78）

[T3]
Meter=String
X=16
Y=112
FontFace=Microsoft YaHei UI
FontSize=10
FontColor=245,184,58,255
AntiAlias=1
Text=第 3 行（Y=112）

; ---- 数据链路：只取前 3 个值（标题 / 状态 / 状态色）----
[WebTop]
Measure=WebParser
URL=#SERVER#/api/skin?part=top
UpdateDivider=6
UpdateRate=1
RegExp=(?si)"v":\["(.*?)","(.*?)","(.*?)"

[c01]
Measure=WebParser
URL=[WebTop]
StringIndex=1
UpdateDivider=6

[c02]
Measure=WebParser
URL=[WebTop]
StringIndex=2
UpdateDivider=6

[c03]
Measure=WebParser
URL=[WebTop]
StringIndex=3
UpdateDivider=6

[Show]
Meter=String
X=16
Y=150
FontFace=Microsoft YaHei UI
FontSize=10
FontColor=226,232,240,255
AntiAlias=1
Text=[&c01] / [&c02] / [&c03]
DynamicVariables=1

[Hint]
Meter=String
X=16
Y=178
FontFace=Microsoft YaHei UI
FontSize=8
FontColor=148,163,184,255
AntiAlias=1
Text=上一行若为空 → 数据链路不通（检查 EasyTier / SERVER 地址 / /api/skin 是否能出 JSON）

; ---- Bar 度量取数（GPU 第 1 行的负载%）----
[WebGpu]
Measure=WebParser
URL=#SERVER#/api/skin?part=gpu
UpdateDivider=6
UpdateRate=1
RegExp=(?si)"v":\["(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)"

[glabel]
Measure=WebParser
URL=[WebGpu]
StringIndex=2
UpdateDivider=6

[gmeta]
Measure=WebParser
URL=[WebGpu]
StringIndex=4
UpdateDivider=6

[gutil]
Measure=WebParser
URL=[WebGpu]
StringIndex=5
UpdateDivider=6
MinValue=0
MaxValue=100

[gcolor]
Measure=WebParser
URL=[WebGpu]
StringIndex=6
UpdateDivider=6

[GText]
Meter=String
X=16
Y=206
FontFace=Microsoft YaHei UI
FontSize=9
FontColor=[&gcolor]
AntiAlias=1
Text=[&glabel] · [&gmeta]
DynamicVariables=1

[WinInfo]
Meter=String
X=16
Y=240
FontFace=Microsoft YaHei UI
FontSize=8.5
FontColor=126,226,168,255
AntiAlias=1
Text=皮肤窗口 #CURRENTCONFIGWIDTH# x #CURRENTCONFIGHEIGHT# · 屏幕 #SCREENAREAWIDTH# x #SCREENAREAHEIGHT#
DynamicVariables=1

[Hint2]
Meter=String
X=16
Y=260
FontFace=Microsoft YaHei UI
FontSize=8
FontColor=148,163,184,255
AntiAlias=1
Text=正常应为 420 x 780 左右；若宽度明显更大 → 有元素溢出被动态窗口撑开

[GBar]
Meter=Bar
X=250
Y=208
W=200
H=10
MeasureName=gutil
BarOrientation=Horizontal
BarColor=[&gcolor]
SolidColor=30,41,59,255
DynamicVariables=1
