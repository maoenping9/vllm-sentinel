; ============================================================
;  vLLM Sentinel — Windows 桌面组件（Rainmeter 皮肤）
;  数据源：/api/skin?part=top|gpu（固定顺序值数组，服务器算好展示语义）
;  本文件由 desktop/win-rainmeter/gen_skin2.py 生成，请勿手改；改版式改生成器常量
;  选项均经官方 manual 校验（validate_ini.py 用文档白名单机械核对）
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
DragEnabled=1
RestoreAfterRestart=1

[Variables]
; 唯一需要改的配置：服务器地址（EasyTier 内网 your-server-ip + 控制台端口 8889）
SERVER=http://your-server-ip:8889
REFRESH_SEC=6
; 配色（想微调只改这几行）：卡片渐变两端 / 圆角描边 / 进度条底槽
BG_TOP=10,15,26,255
BG_BOTTOM=19,27,45,255
BORDER=64,88,132,255
TROUGH=38,52,74,255

; 样式节：仅字体类属性。Rainmeter 规则是 Meter 自身选项优先于样式，但仍不在此放坐标
[StyleBase]
FontFace=Microsoft YaHei UI
FontSize=9
FontColor=226,232,240,255
AntiAlias=1
[StyleTiny]
FontSize=8
FontColor=141,155,175,255
[StyleSec]
FontSize=8
FontColor=166,180,200,255
[StyleTitle]
FontSize=11
FontWeight=Bold
[StyleRight]
StringAlign=Right

[WebTop]
Measure=WebParser
URL=#SERVER#/api/skin?part=top
UpdateDivider=6
UpdateRate=1
RegExp=(?si)"v":\["(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)"\]

[WebGpu]
Measure=WebParser
URL=#SERVER#/api/skin?part=gpu
UpdateDivider=6
UpdateRate=1
RegExp=(?si)"v":\["(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)"\]

