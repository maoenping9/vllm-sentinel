; ============================================================
;  vLLM Sentinel — Windows 桌面组件（Rainmeter 皮肤）
;  数据源：/api/skin?part=top|gpu（固定顺序值数组，服务器算好展示语义）
;  本文件由 desktop/win-rainmeter/gen_skin2.py 生成，请勿手改；改版式改生成器常量
;  选项均经官方 manual 校验（validate_ini.py 用文档白名单机械核对）
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
DragEnabled=1
RestoreAfterRestart=1

[Variables]
; 唯一需要改的配置：服务器地址（EasyTier 内网 your-server-ip + 控制台端口 8889）
SERVER=http://your-server-ip:8889
REFRESH_SEC=6
; 卡片配色由服务端按系统主题（dark/light）给全，这里不用配
; 系统强调色自动读取（注册表 HKCU/Software/Microsoft/Windows/DWM/AccentColor）；读不到就用下面这个兜底色
ACCENT_FALLBACK=76,194,255,255
; 字体：想换字体只改这一行（如 Segoe UI Variable Text / 微软雅黑 / HarmonyOS Sans）
FONT_FACE=Microsoft YaHei UI

; 样式节：仅字体类属性。Rainmeter 规则是 Meter 自身选项优先于样式，但仍不在此放坐标
[StyleBase]
FontFace=#FONT_FACE#
FontSize=9
FontColor=255,255,255,255
AntiAlias=1
[StyleTiny]
FontSize=8.5
FontColor=190,190,190,255
[StyleSec]
FontSize=8.5
FontColor=150,150,150,255
[StyleTitle]
FontSize=11.5
FontWeight=SemiBold
[StyleRight]
StringAlign=Right

; ---------------- 系统强调色（自动跟随 Windows 个性化颜色）----------------
[AccentV]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Microsoft\Windows\DWM
RegValue=AccentColor

[AccentR]
Measure=Calc
Formula=(Trunc([&AccentV]/65536) & 255)
DynamicVariables=1

[AccentG]
Measure=Calc
Formula=(Trunc([&AccentV]/256) & 255)
DynamicVariables=1

[AccentB]
Measure=Calc
Formula=([&AccentV] & 255)
DynamicVariables=1

[AccentC]
Measure=String
String=[&AccentR],[&AccentG],[&AccentB],255
Substitute="0,0,0,255":"#ACCENT_FALLBACK#"
DynamicVariables=1

; ---------------- 系统主题（浅色/深色）→ 作为 theme 参数上报服务端 ----------------
[msTheme]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
RegValue=AppsUseLightTheme
OnChangeAction=[!CommandMeasure "WebTop" "Update"][!CommandMeasure "WebGpu" "Update"]

[WebTop]
Measure=WebParser
URL=#SERVER#/api/skin?part=top&theme=[&msTheme]
DynamicVariables=1
UpdateDivider=6
UpdateRate=1
RegExp=(?si)"v":\["(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)"\]

[WebGpu]
Measure=WebParser
URL=#SERVER#/api/skin?part=gpu&theme=[&msTheme]
DynamicVariables=1
UpdateDivider=6
UpdateRate=1
RegExp=(?si)"v":\["(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)","(.*?)"\]

