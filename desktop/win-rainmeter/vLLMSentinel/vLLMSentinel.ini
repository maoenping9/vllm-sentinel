; ---------------- 数据层：单请求聚合端点 ----------------
[WebSummary]
Measure=Plugin
Plugin=WebParser
URL=[#SERVER]/api/summary
UpdateDivider=[#REFRESH_MS]
DynamicVariables=1
HTTPTimeout=5000
RetryCount=0

; ---- 顶层标量（字段名唯一，直接子正则） ----
