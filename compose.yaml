name: vllm-sentinel

services:
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    image: vllm-sentinel:1.1.1
    container_name: vllm-sentinel
    restart: unless-stopped
    network_mode: host
    pid: host
    gpus: all
    read_only: true
    cap_drop:
      - ALL
    group_add:
      # v97: 容器以 uid=sentinel(999) 运行，串口节点 660 root:dialout —— 追加 dialout(gid20)
      - "20"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    devices:
      # v97: 风暴盒(BOSS Storm3, CH341 串口) —— 读 get_LEVELS 换算 GPU3/4/6 RPM
      - /dev/ttyUSB0:/dev/ttyUSB0
    device_cgroup_rules:
      # 本机 cgroup v2 下 --device 未写入 eBPF 设备过滤，需显式放行串口字符设备(188)
      - "c 188:* rwm"
    volumes:
      - /:/host:ro,rslave
      - sentinel-data:/data
      # v97: 风暴盒(BOSS Storm3, CH341 串口) RPM 换算 —— 容器内读串口 get_LEVELS
      # 后端补丁：用 repo 当前版覆盖镜像内置旧版（含 gpu_map / 矿卡风扇映射），
      # 避免重建后回退到 09-13 镜像代码；与运行中的 bind-mount 校验一致（md5 相同）。
      - ./backend/app.py:/app/backend/app.py:ro
      - ./backend/host_metrics.py:/app/backend/host_metrics.py:ro
      # v93 补丁：discovery.py 用 repo 当前版（docker-proxy 兜底发现容器化 vLLM）
      - ./backend/discovery.py:/app/backend/discovery.py:ro
      # v93 补丁：gpu_map.py 用 repo 当前版（容器化 vLLM 主进程无 --port 时按
      # served-model-name/model 兜底归属 GPU）
      - ./backend/gpu_map.py:/app/backend/gpu_map.py:ro
    environment:
      SENTINEL_PORT: ${SENTINEL_PORT:-8733}
      VLLM_ENDPOINTS: ${VLLM_ENDPOINTS:-[{"name":"DeepSeek-V4-Flash","url":"http://127.0.0.1:9003"}]}
      SAMPLE_INTERVAL: ${SAMPLE_INTERVAL:-2}
      HISTORY_RETENTION_HOURS: ${HISTORY_RETENTION_HOURS:-744}
      DASHBOARD_AUTH_ENABLED: ${DASHBOARD_AUTH_ENABLED:-false}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      GPU_TEMP_WARNING: ${GPU_TEMP_WARNING:-78}
      GPU_TEMP_CRITICAL: ${GPU_TEMP_CRITICAL:-86}
      GPU_MEMORY_WARNING: ${GPU_MEMORY_WARNING:-92}
      QUEUE_WARNING: ${QUEUE_WARNING:-16}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility,compute
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.getenv('SENTINEL_PORT','8733')+'/api/health',timeout=3)\""]
      interval: 15s
      timeout: 4s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  bmc-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: vllm-sentinel:1.1.1
    container_name: vllm-sentinel-bmc
    restart: unless-stopped
    network_mode: none
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/ipmi0:/dev/ipmi0
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - sentinel-data:/data
    environment:
      BMC_SAMPLE_INTERVAL: ${BMC_SAMPLE_INTERVAL:-5}
    command: ["python", "-m", "backend.bmc_agent"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; d=json.load(open('/data/bmc-state.json')); assert d.get('online') and time.time()-d['timestamp'] < 30"]
      interval: 15s
      timeout: 4s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  sentinel-data:
    name: vllm-sentinel-data
